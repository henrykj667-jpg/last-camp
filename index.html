<div id="root"></div><link rel="stylesheet" href="/src/chop-effects.css"><style>.hero.gathering:after{content:'🧺';position:absolute;z-index:12;left:23px;top:27px;font-size:25px;filter:drop-shadow(0 3px 2px #0008);animation:basketGather .85s ease-in-out}.hero.gathering .a2{animation:gatherArm .42s ease-in-out 2}.hero.gathering .body{animation:gatherBody .42s ease-in-out 2}@keyframes basketGather{0%{opacity:0;transform:translateY(8px) scale(.7)}18%{opacity:1;transform:translateY(0) scale(1)}72%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(5px) scale(.8)}}@keyframes gatherArm{0%,100%{transform:rotate(0)}50%{transform:rotate(-48deg) translateY(3px)}}@keyframes gatherBody{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) rotate(3deg)}}</style><script>document.addEventListener('click',e=>{if(!e.target.closest('.berry'))return;requestAnimationFrame(()=>{const h=document.querySelector('.hero');if(!h)return;h.classList.remove('gathering');void h.offsetWidth;h.classList.add('gathering');setTimeout(()=>h.classList.remove('gathering'),900)})})</script><script type="module" src="/src/main.jsx"></script>
