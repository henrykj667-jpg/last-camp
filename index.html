<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07110b"></head><body><div id="root"></div><link rel="stylesheet" href="/src/chop-effects.css"><style>.game,.startscreen,.intro{width:100vw!important;max-width:none!important;margin:0!important}.hero.gathering:after{content:'🧺';position:absolute;z-index:12;left:23px;top:27px;font-size:25px;filter:drop-shadow(0 3px 2px #0008);animation:basketGather .85s ease-in-out}.hero.gathering .a2{animation:gatherArm .42s ease-in-out 2}.hero.gathering .body{animation:gatherBody .42s ease-in-out 2}@keyframes basketGather{0%{opacity:0;transform:translateY(8px) scale(.7)}18%{opacity:1;transform:translateY(0) scale(1)}72%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(5px) scale(.8)}}@keyframes gatherArm{0%,100%{transform:rotate(0)}50%{transform:rotate(-48deg) translateY(3px)}}@keyframes gatherBody{0%,100%{transform:translateY(0)}50%{transform:translateY(3px) rotate(3deg)}}.touchstick{display:none!important}#joybase{display:none;position:fixed;width:108px;height:108px;border:3px solid #ffffff66;border-radius:50%;background:#10182088;box-shadow:inset 0 0 24px #0008,0 4px 20px #0007;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);backdrop-filter:blur(2px)}#joybase.on{display:block!important}#joythumb{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#ffffff88;border:2px solid #ffffffaa;box-shadow:0 3px 10px #0008;transform:translate(-50%,-50%);will-change:transform}</style><div id="joybase"><i id="joythumb"></i></div><script>document.addEventListener('click',e=>{if(!e.target.closest('.berry'))return;requestAnimationFrame(()=>{const h=document.querySelector('.hero');if(!h)return;h.classList.remove('gathering');void h.offsetWidth;h.classList.add('gathering');setTimeout(()=>h.classList.remove('gathering'),900)})});(()=>{let active=false,pid=null,ox=0,oy=0,dx=0,dy=0,power=0;const base=document.getElementById('joybase'),thumb=document.getElementById('joythumb'),R=42,DEAD=8;function blocked(t){return t.closest&&t.closest('.object,.camp,.hud,.actionbar,.skip,.startscreen')}function send(type){const w=document.querySelector('.world'),pl=document.querySelector('.player');if(!w||!pl)return;const wr=w.getBoundingClientRect(),pr=pl.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2;let dist=7+22*power,px=wr.width/100*dist,py=wr.height/100*dist,len=Math.hypot(dx,dy)||1,sx=cx+dx/len*px,sy=cy+dy/len*py;const ev=new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:pid||1,pointerType:'touch',clientX:sx,clientY:sy});Object.defineProperty(ev,'__joySynthetic',{value:true});w.dispatchEvent(ev)}function update(x,y){let x1=x-ox,y1=y-oy,d=Math.hypot(x1,y1),cl=Math.min(R,d),nx=d?x1/d:0,ny=d?y1/d:0;dx=nx;dy=ny;power=d<=DEAD?0:Math.min(1,(d-DEAD)/(R-DEAD));thumb.style.transform=`translate(calc(-50% + ${nx*cl}px),calc(-50% + ${ny*cl}px))`;send('pointermove')}document.addEventListener('pointerdown',e=>{if(e.__joySynthetic||active||blocked(e.target))return;const w=e.target.closest&&e.target.closest('.world');if(!w)return;const r=w.getBoundingClientRect();if(e.clientX>r.left+r.width*.62)return;e.preventDefault();e.stopPropagation();active=true;pid=e.pointerId;ox=e.clientX;oy=e.clientY;dx=dy=power=0;base.style.left=ox+'px';base.style.top=oy+'px';base.classList.add('on');thumb.style.transform='translate(-50%,-50%)';send('pointerdown')},true);document.addEventListener('pointermove',e=>{if(e.__joySynthetic||!active||e.pointerId!==pid)return;e.preventDefault();e.stopPropagation();update(e.clientX,e.clientY)},true);function end(e){if(e.__joySynthetic||!active||e.pointerId!==pid)return;e.preventDefault();e.stopPropagation();power=0;send('pointerup');active=false;pid=null;base.classList.remove('on');thumb.style.transform='translate(-50%,-50%)'}document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true)})();</script><script type="module" src="/src/main.jsx"></script></body></html>
