name: Build Godot Web

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 godot-bin
          chmod +x godot-bin

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.1.stable/

      - name: Export web build
        run: |
          mkdir -p web-build
          ./godot-bin --headless --path godot --export-release Web ../web-build/index.html

      - name: Publish test build
        run: |
          touch web-build/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan godot-web
          git rm -rf .
          cp -r web-build/. .
          git add -A
          git commit -m "Deploy BLACKOUT Godot web build"
          git push --force origin godot-web
