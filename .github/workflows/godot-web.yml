name: Build Godot Web

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-engine
          mv /tmp/godot-engine/Godot_v4.5.1-stable_linux.x86_64 /tmp/godot-bin
          chmod +x /tmp/godot-bin

      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.5.1.stable/

      - name: Export web build
        run: |
          rm -rf /tmp/blackout-web
          mkdir -p /tmp/blackout-web
          /tmp/godot-bin --headless --path godot --export-release Web /tmp/blackout-web/index.html
          touch /tmp/blackout-web/.nojekyll

      - name: Publish test build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan godot-web
          git rm -rf .
          cp -r /tmp/blackout-web/. .
          git add -A
          git commit -m "Deploy BLACKOUT Godot web build"
          git push --force origin godot-web
